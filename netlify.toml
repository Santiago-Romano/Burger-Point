[build]
  command = "bun run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "24"
  BUN_VERSION = "1.4.2"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
